name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Gate sur les dépendances de production uniquement.
      # Les advisories dev-only (vitest/vite/esbuild) ne bloquent pas le build.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
